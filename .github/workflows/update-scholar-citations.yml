name: Update Google Scholar citations

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-scholar-citations.yml"
      - "scripts/update-scholar-citations.mjs"

permissions:
  actions: write
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refresh citation count
        env:
          SCHOLAR_ID: kzBPdVgAAAAJ
        run: node scripts/update-scholar-citations.mjs

      - name: Commit the refreshed count
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- src/content/bio.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/bio.md
          git commit -m "chore: update Google Scholar citations"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
